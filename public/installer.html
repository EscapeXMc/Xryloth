<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xryloth Installer</title>
    <style>
        :root {
            --bg-0: #07080b;
            --bg-1: #0b0d12;
            --card: rgba(19, 22, 28, 0.72);
            --stroke: rgba(255, 255, 255, 0.08);
            --accent: #e06b22;
            --text: #f4f4f5;
            --sub: #a1a1aa;
            --muted: #6b7280;
            --ok: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background:
                radial-gradient(900px 500px at 20% -10%, rgba(224, 107, 34, 0.12), transparent 60%),
                linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .wrap { width: 340px; text-align: center; padding: 1.25rem; }

        .logo {
            width: 68px; height: 68px;
            margin: 0 auto 0.9rem;
            border-radius: 19px;
            background: linear-gradient(150deg, rgba(224, 107, 34, 0.95), rgba(234, 88, 12, 0.75));
            box-shadow: 0 10px 30px rgba(224, 107, 34, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            color: #fff; font-size: 2rem; font-weight: 900;
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; }

        h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; }

        .msg {
            margin: 1rem 0 0.85rem;
            color: var(--sub);
            font-size: 0.94rem;
            min-height: 1.4em;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .msg.ok { color: var(--ok); }
        .msg.err { color: var(--danger); }

        .spinner {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            display: none;
            flex: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .bar {
            height: 6px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.07);
            overflow: hidden;
            display: none;
            margin-bottom: 0.9rem;
        }
        .bar .fill {
            height: 100%; width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, #e06b22, #f59e0b);
            transition: width 0.25s;
        }

        .btn {
            display: block; width: 100%;
            margin: 0.45rem 0;
            padding: 0.7rem;
            border: 0; border-radius: 12px;
            font-size: 0.93rem; font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn.primary {
            background: linear-gradient(150deg, #e06b22, #c2410c);
            color: #fff;
            box-shadow: 0 8px 22px rgba(224, 107, 34, 0.3);
        }
        .btn.primary:hover { filter: brightness(1.08); }
        .btn.ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke);
            color: var(--sub);
            font-weight: 600;
        }
        .btn.ghost:hover { background: rgba(255, 255, 255, 0.09); }
        .btn.danger { background: var(--danger); color: #fff; }

        .path {
            font-size: 0.77rem;
            color: var(--muted);
            margin-top: 0.6rem;
            display: none;
        }
        .path b { color: var(--sub); font-weight: 600; }
        .path a { color: var(--accent); cursor: pointer; text-decoration: none; margin-left: 0.35rem; }

        .link {
            display: none;
            margin-top: 0.8rem;
            font-size: 0.77rem;
            color: var(--muted);
            cursor: pointer;
            text-decoration: none;
        }
        .link:hover { color: var(--danger); }

        .foot { margin-top: 1.2rem; font-size: 0.72rem; color: var(--muted); }

        /* Custom confirm dialog (no native alert/confirm) */
        .dlg {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: center; justify-content: center;
            z-index: 50;
        }
        .dlg.active { display: flex; }
        .dlg .box {
            width: 290px;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
        }
        .dlg h3 { font-size: 1rem; margin-bottom: 0.45rem; }
        .dlg p { font-size: 0.8rem; color: var(--sub); margin-bottom: 1rem; line-height: 1.45; }
        .dlg .row { display: flex; gap: 0.6rem; }
        .dlg .btn { margin: 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo"><img src="logo.png" alt="Xryloth" onerror="this.remove()"></div>
        <h1>Xryloth Installer</h1>

        <div class="msg" id="msg">
            <span class="spinner" id="spin"></span>
            <span id="msgText">Starting…</span>
        </div>

        <div class="bar" id="bar"><div class="fill" id="fill"></div></div>

        <button class="btn primary" id="installBtn" style="display:none">Install Xryloth</button>
        <button class="btn ghost" id="retryBtn" style="display:none">Try again</button>
        <button class="btn ghost" id="launchBtn" style="display:none">Launch Xryloth</button>

        <div class="path" id="pathRow">Install to <b id="pathVal">~/Xryloth</b><a id="changeDir">Change</a></div>
        <a class="link" id="uninstallLink">Uninstall</a>

        <div class="foot">Xryloth by EscapeX</div>
    </div>

    <!-- Custom confirm dialog -->
    <div class="dlg" id="confirmDlg">
        <div class="box">
            <h3>Uninstall Xryloth?</h3>
            <p>This removes the launcher and all its files from your PC.</p>
            <div class="row">
                <button class="btn ghost" id="cancelBtn">Cancel</button>
                <button class="btn danger" id="confirmBtn">Uninstall</button>
            </div>
        </div>
    </div>

    <script>
        // Tauri v1 global API: window.__TAURI__.tauri (invoke), .event (listen), .dialog (open)
        const __TAURI_API__ = window.__TAURI__ || {};
        const { invoke } = __TAURI_API__.tauri || __TAURI_API__.core || {};
        const { listen } = __TAURI_API__.event || {};
        const { open } = __TAURI_API__.dialog || {};

        const $ = (id) => document.getElementById(id);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        let installed = false;
        let installDir = '';           // '' = default (~/Xryloth)
        let busy = false;              // false | 'install' | 'update'

        // One short status line — that's the whole UI language.
        function msg(text, opts = {}) {
            $('msgText').textContent = text;
            $('msg').className = 'msg' + (opts.cls ? ' ' + opts.cls : '');
            $('spin').style.display = opts.spin ? 'inline-block' : 'none';
        }
        // 'block' (not '') — .path/.link/.bar are hidden by CSS class rules,
        // so clearing the inline style would just re-apply display:none.
        function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }
        function hideActions() {
            ['installBtn', 'retryBtn', 'launchBtn', 'pathRow', 'uninstallLink'].forEach((id) => show(id, false));
        }
        function setProgress(frac) {
            show('bar', true);
            $('fill').style.width = Math.round(frac * 100) + '%';
        }

        if (typeof listen === 'function') {
            listen('installer-progress', (e) => {
                const p = e.payload || {};
                const pct = Math.round((p.progress || 0) * 100);
                setProgress(p.progress || 0);
                if (pct >= 100) {
                    msg(p.message || 'Finishing…');
                } else if (busy === 'install') {
                    msg('Installing… ' + pct + '%');
                } else if (busy === 'update') {
                    msg('Updating… ' + pct + '%');
                }
            }).catch(() => {});
        }

        function installConfig() {
            return {
                install_dir: installDir,
                create_desktop_shortcut: true,
                create_taskbar_shortcut: true,
                create_start_menu_shortcut: true,
                auto_start: false,
            };
        }

        // Main flow: check → (install button | auto-update | straight launch) → close.
        async function boot() {
            hideActions();
            show('bar', false);
            msg('Checking for update…', { spin: true });
            try {
                installed = await invoke('installer_check_installed');

                let latest = null;
                try {
                    const release = await invoke('installer_fetch_release');
                    latest = release && release.tag_name;
                } catch (e) { /* offline — handled below */ }

                if (!installed) {
                    msg('Ready to install');
                    show('installBtn', true);
                    show('pathRow', true);
                    $('pathVal').textContent = installDir || '~/Xryloth';
                    return;
                }

                if (!latest) {
                    msg("Couldn't check for update");
                    show('retryBtn', true);
                    show('launchBtn', true);
                    show('uninstallLink', true);
                    return;
                }

                const cfg = await invoke('installer_get_config');
                const current = (cfg && cfg.version) || '';
                if (current === latest) {
                    // Already up to date → simply run the launcher and close.
                    msg('Already up to date', { cls: 'ok' });
                    await sleep(600);
                    await launchAndClose();
                    return;
                }

                // Update available → update automatically, no button press.
                msg('Update available — updating…');
                await sleep(400);
                await doUpdate();
            } catch (e) {
                fail('Something went wrong', e);
            }
        }

        async function doUpdate() {
            busy = 'update';
            hideActions();
            setProgress(0);
            msg('Updating…');
            try {
                await invoke('installer_update');
                busy = false;
                await launchAndClose();
            } catch (e) {
                busy = false;
                fail('Update failed', e);
            }
        }

        async function doInstall() {
            busy = 'install';
            hideActions();
            setProgress(0);
            msg('Installing…');
            try {
                await invoke('installer_install', { config: installConfig() });
                installed = true;
                busy = false;
                await launchAndClose();
            } catch (e) {
                busy = false;
                fail('Install failed', e);
            }
        }

        async function launchAndClose() {
            show('bar', false);
            try {
                msg('Launching Xryloth…');
                await invoke('installer_launch_launcher');
                await sleep(1000);
                msg('Closing…');
                await sleep(500);
                await invoke('installer_close_app');
            } catch (e) {
                fail("Couldn't launch Xryloth", e);
            }
        }

        function fail(text, err) {
            const detail = (err && (err.message || String(err))) || '';
            msg(text + (detail ? ' — ' + detail : ''), { cls: 'err' });
            show('bar', false);
            show('retryBtn', true);
            if (installed) {
                show('launchBtn', true);
                show('uninstallLink', true);
            }
        }

        $('installBtn').addEventListener('click', doInstall);
        $('retryBtn').addEventListener('click', boot);
        $('launchBtn').addEventListener('click', () => { if (!busy) launchAndClose(); });
        $('changeDir').addEventListener('click', async () => {
            try {
                const picked = await open({ directory: true, multiple: false });
                if (picked) {
                    installDir = Array.isArray(picked) ? picked[0] : picked;
                    $('pathVal').textContent = installDir;
                }
            } catch (e) { /* keep default */ }
        });
        $('uninstallLink').addEventListener('click', () => $('confirmDlg').classList.add('active'));
        $('cancelBtn').addEventListener('click', () => $('confirmDlg').classList.remove('active'));
        $('confirmBtn').addEventListener('click', async () => {
            $('confirmDlg').classList.remove('active');
            hideActions();
            msg('Uninstalling…', { spin: true });
            try {
                await invoke('installer_uninstall');
                installed = false;
                try { await invoke('installer_open_uninstall_page'); } catch (e) { /* page is optional */ }
                msg('Xryloth removed');
                show('installBtn', true);
                show('pathRow', true);
                $('pathVal').textContent = installDir || '~/Xryloth';
            } catch (e) {
                fail('Uninstall failed', e);
            }
        });

        document.addEventListener('DOMContentLoaded', boot);
    </script>
</body>
</html>
